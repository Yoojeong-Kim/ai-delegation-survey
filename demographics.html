<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Information — AI Proxy Study</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .demographics-main { padding: 36px 0 80px; }
  </style>
</head>
<body>
<div class="page-wrap">

  <header class="site-header">
    <span class="logo">AI Proxy Delegation Study</span>
    <span class="pid-tag" id="header-pid"></span>
  </header>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span class="progress-label">Step 1 of 3 — Background</span>
      <span class="progress-step-text">Q1–Q5</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width: 10%"></div>
    </div>
  </div>

  <main class="container demographics-main">

    <div class="anim-up">
      <h1 class="page-title">Background Information</h1>
      <p class="page-sub">Please tell us a little bit about yourself.</p>
    </div>

    <!-- Q1: Birth Year -->
    <div class="card mt-32 anim-up-1">
      <label class="form-label" for="q1">
        <span class="qnum">1.</span> What is your year of birth?
      </label>
      <input type="number" class="form-input" id="q1" placeholder="YYYY" min="1920" max="2005" style="max-width: 120px;">
    </div>

    <!-- Q2: Gender -->
    <div class="card mt-16 anim-up-1">
      <label class="form-label">
        <span class="qnum">2.</span> How do you describe your gender?
      </label>
      <div class="radio-list">
        <label class="radio-item" onclick="pick('q2', 'Male', this)">
          <input type="radio" name="q2" value="Male">
          <div class="radio-dot"></div>
          <span class="radio-text">Male</span>
        </label>
        <label class="radio-item" onclick="pick('q2', 'Female', this)">
          <input type="radio" name="q2" value="Female">
          <div class="radio-dot"></div>
          <span class="radio-text">Female</span>
        </label>
        <label class="radio-item" onclick="pick('q2', 'Non-binary', this)">
          <input type="radio" name="q2" value="Non-binary">
          <div class="radio-dot"></div>
          <span class="radio-text">Non-binary / Other</span>
        </label>
        <label class="radio-item" onclick="pick('q2', 'Prefer not to say', this)">
          <input type="radio" name="q2" value="Prefer not to say">
          <div class="radio-dot"></div>
          <span class="radio-text">Prefer not to say</span>
        </label>
      </div>
    </div>

    <!-- Q3: Education -->
    <div class="card mt-16 anim-up-2">
      <label class="form-label">
        <span class="qnum">3.</span> What is your highest level of education completed?
      </label>
      <div class="radio-list">
        <label class="radio-item" onclick="pick('q3', 'High School', this)">
          <input type="radio" name="q3" value="High School">
          <div class="radio-dot"></div>
          <span class="radio-text">High School or equivalent</span>
        </label>
        <label class="radio-item" onclick="pick('q3', 'Some College', this)">
          <input type="radio" name="q3" value="Some College">
          <div class="radio-dot"></div>
          <span class="radio-text">Some College</span>
        </label>
        <label class="radio-item" onclick="pick('q3', 'Bachelors', this)">
          <input type="radio" name="q3" value="Bachelors">
          <div class="radio-dot"></div>
          <span class="radio-text">Bachelor's Degree</span>
        </label>
        <label class="radio-item" onclick="pick('q3', 'Masters/Professional', this)">
          <input type="radio" name="q3" value="Masters/Professional">
          <div class="radio-dot"></div>
          <span class="radio-text">Master's or Professional Degree</span>
        </label>
        <label class="radio-item" onclick="pick('q3', 'Doctorate', this)">
          <input type="radio" name="q3" value="Doctorate">
          <div class="radio-dot"></div>
          <span class="radio-text">Doctorate</span>
        </label>
      </div>
    </div>

    <!-- Q4: Work experience — controls Q5 visibility -->
    <div class="card mt-16 anim-up-2">
      <label class="form-label">
        <span class="qnum">4.</span> Are you currently employed or have you been employed within the last 5 years?
      </label>
      <div class="radio-list flex-row">
        <label class="radio-item" onclick="pickQ4('Yes', this)">
          <input type="radio" name="q4" value="Yes">
          <div class="radio-dot"></div>
          <span class="radio-text">Yes</span>
        </label>
        <label class="radio-item" onclick="pickQ4('No', this)">
          <input type="radio" name="q4" value="No">
          <div class="radio-dot"></div>
          <span class="radio-text">No</span>
        </label>
      </div>
    </div>

    <!-- Q5: Work type (Conditional) -->
    <div class="card mt-16 anim-up-3" id="q5-box" style="display:none;">
      <label class="form-label" for="q5">
        <span class="qnum">5.</span> Which of the following best describes your typical work?
      </label>
      <div class="radio-list">
        <label class="radio-item" onclick="pick('q5', 'Knowledge Work', this)">
          <input type="radio" name="q5" value="Knowledge Work">
          <div class="radio-dot"></div>
          <span class="radio-text">Knowledge / Office Work (e.g., admin, tech, finance)</span>
        </label>
        <label class="radio-item" onclick="pick('q5', 'Service', this)">
          <input type="radio" name="q5" value="Service">
          <div class="radio-dot"></div>
          <span class="radio-text">Service / Retail</span>
        </label>
        <label class="radio-item" onclick="pick('q5', 'Manual/Trades', this)">
          <input type="radio" name="q5" value="Manual/Trades">
          <div class="radio-dot"></div>
          <span class="radio-text">Manual Labor / Trades</span>
        </label>
        <label class="radio-item" onclick="pick('q5', 'Other', this)">
          <input type="radio" name="q5" value="Other">
          <div class="radio-dot"></div>
          <span class="radio-text">Other</span>
        </label>
      </div>
      <div id="q5-other-wrap" style="display:none; margin-top:12px; margin-left:36px;">
        <input type="text" class="form-input" id="q5-other" 
            placeholder="Please describe your work type…" style="max-width:400px;">
      </div>
    </div>

    <!-- Next -->
    <div class="text-center mt-40 anim-up-3">
      <button id="next-btn" class="btn btn-primary"
        style="min-width:200px; min-height:52px; font-size:15px;" onclick="goNext()">
        Continue &nbsp;→
      </button>
    </div>

  </main>
</div>

<script src="js/app.js"></script>
<script>
  // Restore basic session or create if missing
  let sd = getSurveyData();
  if (!sd || !sd.participantId) {
    console.warn('Session data missing or invalid in demographics.html');
    window.location.href = 'index.html';
  } else {
    showParticipantId();
  }

  const ans = { q1: null, q2: null, q3: null, q4: null, q5: null };

  function pick(qName, val, el) {
    ans[qName] = val;
    document.querySelectorAll(`[name="${qName}"]`).forEach(() => {}); // satisfy linters
    el.closest('.radio-list').querySelectorAll('.radio-item').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input').checked = true;

    if (qName === 'q5') {
      document.getElementById('q5-other-wrap').style.display = (val === 'Other') ? 'block' : 'none';
    }
  }

  function pickQ4(val, el) {
    pick('q4', val, el);
    const q5Box = document.getElementById('q5-box');
    if (val === 'Yes') {
      q5Box.style.display = 'block';
    } else {
      q5Box.style.display = 'none';
      ans.q5 = null;
      document.querySelectorAll('[name="q5"]').forEach(r => r.checked = false);
      document.querySelectorAll('#q5-box .radio-item').forEach(i => i.classList.remove('selected'));
      document.getElementById('q5-other-wrap').style.display = 'none';
      document.getElementById('q5-other').value = '';
    }
  }

  function goNext() {
    ans.q1 = document.getElementById('q1').value;
    if (!ans.q1) return alert('Please enter your birth year.');
    if (parseInt(ans.q1) > 2005 || parseInt(ans.q1) < 1920) return alert('Please enter a valid birth year.');
    if (!ans.q2) return alert('Please select a gender.');
    if (!ans.q3) return alert('Please select your education level.');
    if (!ans.q4) return alert('Please answer if you have work experience.');
    
    if (ans.q4 === 'Yes') {
      if (!ans.q5) return alert('Please select your work type.');
      if (ans.q5 === 'Other') {
        const otherTxt = document.getElementById('q5-other').value.trim();
        if (!otherTxt) return alert('Please describe your work type.');
        ans.q5 = 'Other: ' + otherTxt;
      }
    }

    const data = getSurveyData();
    data.demographics = ans;
    saveSurveyData(data);

    const btn = document.getElementById('next-btn');
    btn.disabled = true;
    btn.textContent = 'Loading…';

    window.location.href = 'instructions.html';
  }
</script>
</body>
</html>
