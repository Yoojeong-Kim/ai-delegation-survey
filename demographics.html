<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Information &mdash; AI Proxy Study</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .demographics-main { padding: 36px 0 80px; }
  </style>
</head>
<body>
<div class="page-wrap">

  <header class="site-header">
    <span class="logo">AI Proxy Delegation Study</span>
    <span class="pid-tag" id="header-pid"></span>
  </header>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span class="progress-label">Step 1 of 3 &mdash; Background</span>
      <span class="progress-step-text">Q1&ndash;Q5</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width: 10%"></div>
    </div>
  </div>

  <main class="container demographics-main">

    <div class="anim-up">
      <h1 class="page-title">Background Information</h1>
      <p class="page-sub">Please tell us a little bit about yourself.</p>
    </div>

    <!-- Q1: Birth Year -->
    <div class="card mt-32 anim-up-1">
      <label class="form-label" for="q1">
        <span class="qnum">1.</span> What is your year of birth?
      </label>
      <input type="number" class="form-input" id="q1" placeholder="YYYY" min="1920" max="2005" style="max-width: 120px;">
    </div>

    <!-- Q2: Gender -->
    <div class="card mt-16 anim-up-1">
      <label class="form-label">
        <span class="qnum">2.</span> How do you describe your gender?
      </label>
      <div class="radio-list">
        <label class="radio-item" onclick="pick('q2', 'Male', this)">
          <input type="radio" name="q2" value="Male">
          <div class="radio-dot"></div>
          <span class="radio-text">Male</span>
        </label>
        <label class="radio-item" onclick="pick('q2', 'Female', this)">
          <input type="radio" name="q2" value="Female">
          <div class="radio-dot"></div>
          <span class="radio-text">Female</span>
        </label>
        <label class="radio-item" onclick="pick('q2', 'Non-binary', this)">
          <input type="radio" name="q2" value="Non-binary">
          <div class="radio-dot"></div>
          <span class="radio-text">Non-binary / Other</span>
        </label>
        <label class="radio-item" onclick="pick('q2', 'Prefer not to say', this)">
          <input type="radio" name="q2" value="Prefer not to say">
          <div class="radio-dot"></div>
          <span class="radio-text">Prefer not to say</span>
        </label>
      </div>
    </div>

    <!-- Q3: Education -->
    <div class="card mt-16 anim-up-2">
      <label class="form-label">
        <span class="qnum">3.</span> What is your highest level of education completed?
      </label>
      <div class="radio-list">
        <label class="radio-item" onclick="pick('q3', 'High School', this)">
          <input type="radio" name="q3" value="High School">
          <div class="radio-dot"></div>
          <span class="radio-text">High School or equivalent</span>
        </label>
        <label class="radio-item" onclick="pick('q3', 'Some College', this)">
          <input type="radio" name="q3" value="Some College">
          <div class="radio-dot"></div>
          <span class="radio-text">Some College</span>
        </label>
        <label class="radio-item" onclick="pick('q3', 'Bachelors', this)">
          <input type="radio" name="q3" value="Bachelors">
          <div class="radio-dot"></div>
          <span class="radio-text">Bachelor's Degree</span>
        </label>
        <label class="radio-item" onclick="pick('q3', 'Masters/Professional', this)">
          <input type="radio" name="q3" value="Masters/Professional">
          <div class="radio-dot"></div>
          <span class="radio-text">Master's or Professional Degree</span>
        </label>
        <label class="radio-item" onclick="pick('q3', 'Doctorate', this)">
          <input type="radio" name="q3" value="Doctorate">
          <div class="radio-dot"></div>
          <span class="radio-text">Doctorate</span>
        </label>
      </div>
    </div>

    <!-- Q4: Work experience -->
    <div class="card mt-16 anim-up-2">
      <label class="form-label">
        <span class="qnum">4.</span> Are you currently employed or have you been employed within the last 5 years?
      </label>
      <div class="radio-list flex-row">
        <label class="radio-item" onclick="pickQ4('Yes', this)">
          <input type="radio" name="q4" value="Yes">
          <div class="radio-dot"></div>
          <span class="radio-text">Yes</span>
        </label>
        <label class="radio-item" onclick="pickQ4('No', this)">
          <input type="radio" name="q4" value="No">
          <div class="radio-dot"></div>
          <span class="radio-text">No</span>
        </label>
      </div>
    </div>

    <!-- Q5: Work type / Occupational field -->
    <div class="card mt-16 anim-up-3" id="q5-box" style="display:none;">
      <label class="form-label" for="q5">
        <span class="qnum">5.</span> Which of the following best describes your primary occupational field / industry?
      </label>
      <div class="radio-list">
        <label class="radio-item" onclick="pick('q5', 'Professional, Technical, & Computing', this)">
          <input type="radio" name="q5" value="Professional, Technical, & Computing">
          <div class="radio-dot"></div>
          <span class="radio-text"><strong>Professional, Technical, & Computing</strong> (e.g., Software, IT, Engineering, Science, Legal)</span>
        </label>
        <label class="radio-item" onclick="pick('q5', 'Management, Business, & Financial', this)">
          <input type="radio" name="q5" value="Management, Business, & Financial">
          <div class="radio-dot"></div>
          <span class="radio-text"><strong>Management, Business, & Financial</strong> (e.g., Corporate Management, Finance, Marketing, HR)</span>
        </label>
        <label class="radio-item" onclick="pick('q5', 'Education, Academia, & Research', this)">
          <input type="radio" name="q5" value="Education, Academia, & Research">
          <div class="radio-dot"></div>
          <span class="radio-text"><strong>Education, Academia, & Research</strong> (e.g., Teacher, Professor, Academic Researcher)</span>
        </label>
        <label class="radio-item" onclick="pick('q5', 'Healthcare & Social Services', this)">
          <input type="radio" name="q5" value="Healthcare & Social Services">
          <div class="radio-dot"></div>
          <span class="radio-text"><strong>Healthcare & Social Services</strong> (e.g., Medical Professional, Nursing, Therapy, Social Care)</span>
        </label>
        <label class="radio-item" onclick="pick('q5', 'Office & Administrative Support', this)">
          <input type="radio" name="q5" value="Office & Administrative Support">
          <div class="radio-dot"></div>
          <span class="radio-text"><strong>Office & Administrative Support</strong> (e.g., Administrative Assistant, Office Clerk, Operations)</span>
        </label>
        <label class="radio-item" onclick="pick('q5', 'Sales, Retail, & Customer Service', this)">
          <input type="radio" name="q5" value="Sales, Retail, & Customer Service">
          <div class="radio-dot"></div>
          <span class="radio-text"><strong>Sales, Retail, & Customer Service</strong> (e.g., Retail Associate, Customer Support, Hospitality)</span>
        </label>
        <label class="radio-item" onclick="pick('q5', 'Manufacturing, Construction, & Logistics', this)">
          <input type="radio" name="q5" value="Manufacturing, Construction, & Logistics">
          <div class="radio-dot"></div>
          <span class="radio-text"><strong>Manufacturing, Construction, & Logistics</strong> (e.g., Production, Trades, Construction, Transportation)</span>
        </label>
        <label class="radio-item" onclick="pick('q5', 'Other', this)">
          <input type="radio" name="q5" value="Other">
          <div class="radio-dot"></div>
          <span class="radio-text"><strong>Other</strong> (Please specify below)</span>
        </label>
      </div>
      <div id="q5-other-wrap" style="display:none; margin-top:12px; margin-left:36px;">
        <input type="text" class="form-input" id="q5-other" 
            placeholder="Please specify your occupation/industry&hellip;" style="max-width:400px;">
      </div>
    </div>

    <!-- Next -->
    <div class="text-center mt-40 anim-up-3">
      <button id="next-btn" class="btn btn-primary"
        style="min-width:200px; min-height:52px; font-size:15px;" onclick="goNext()">
        Continue &nbsp;&rarr;
      </button>
    </div>

  </main>
</div>

<script src="js/app.js"></script>
<script>
  let sd = getSurveyData();
  if (!sd || !sd.participantId) {
    console.warn('Session data missing or invalid in demographics.html');
    window.location.href = 'index.html';
  } else {
    showParticipantId();
  }

  const ans = { q1: null, q2: null, q3: null, q4: null, q5: null };

  function pick(qName, val, el) {
    ans[qName] = val;
    el.closest('.radio-list').querySelectorAll('.radio-item').forEach(function(i) { i.classList.remove('selected'); });
    el.classList.add('selected');
    el.querySelector('input').checked = true;

    if (qName === 'q5') {
      document.getElementById('q5-other-wrap').style.display = (val === 'Other') ? 'block' : 'none';
    }
  }

  function pickQ4(val, el) {
    pick('q4', val, el);
    const q5Box = document.getElementById('q5-box');
    if (val === 'Yes') {
      q5Box.style.display = 'block';
    } else {
      q5Box.style.display = 'none';
      ans.q5 = null;
      document.querySelectorAll('[name="q5"]').forEach(function(r) { r.checked = false; });
      document.querySelectorAll('#q5-box .radio-item').forEach(function(i) { i.classList.remove('selected'); });
      document.getElementById('q5-other-wrap').style.display = 'none';
      document.getElementById('q5-other').value = '';
    }
  }

  // Restore previously saved demographics on back navigation
  if (sd && sd.demographics) {
    const d = sd.demographics;
    if (d.q1) {
      document.getElementById('q1').value = d.q1;
      ans.q1 = d.q1;
    }
    ['q2', 'q3', 'q4'].forEach(function(qKey) {
      if (d[qKey]) {
        const input = document.querySelector('input[name="' + qKey + '"][value="' + d[qKey] + '"]');
        if (input) {
          input.checked = true;
          const radioItem = input.closest('.radio-item');
          if (radioItem) radioItem.classList.add('selected');
          ans[qKey] = d[qKey];
        }
      }
    });
    if (d.q4 === 'Yes') {
      document.getElementById('q5-box').style.display = 'block';
      if (d.q5) {
        if (d.q5.startsWith('Other: ')) {
          const otherText = d.q5.replace('Other: ', '');
          const input = document.querySelector('input[name="q5"][value="Other"]');
          if (input) {
            input.checked = true;
            const radioItem = input.closest('.radio-item');
            if (radioItem) radioItem.classList.add('selected');
            ans.q5 = 'Other';
          }
          document.getElementById('q5-other-wrap').style.display = 'block';
          document.getElementById('q5-other').value = otherText;
        } else {
          const input = document.querySelector('input[name="q5"][value="' + d.q5 + '"]');
          if (input) {
            input.checked = true;
            const radioItem = input.closest('.radio-item');
            if (radioItem) radioItem.classList.add('selected');
            ans.q5 = d.q5;
          }
        }
      }
    }
  }

  function goNext() {
    ans.q1 = document.getElementById('q1').value;
    if (!ans.q1) return alert('Please enter your birth year.');
    if (parseInt(ans.q1) > 2005 || parseInt(ans.q1) < 1920) return alert('Please enter a valid birth year.');
    if (!ans.q2) return alert('Please select a gender.');
    if (!ans.q3) return alert('Please select your education level.');
    if (!ans.q4) return alert('Please answer if you have work experience.');
    
    if (ans.q4 === 'Yes') {
      if (!ans.q5) return alert('Please select your primary occupational field.');
      if (ans.q5 === 'Other') {
        const otherTxt = document.getElementById('q5-other').value.trim();
        if (!otherTxt) return alert('Please specify your occupation/industry.');
        ans.q5 = 'Other: ' + otherTxt;
      }
    }

    const data = getSurveyData();
    data.demographics = ans;
    saveSurveyData(data);

    const btn = document.getElementById('next-btn');
    btn.disabled = true;
    btn.textContent = 'Loading\u2026';

    window.location.href = 'instructions.html';
  }
</script>
</body>
</html>
